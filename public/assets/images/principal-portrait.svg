<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" aria-label="Prof. (Dr.) Farooq Ahmad Mir, Principal">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
  </defs>
  <!-- Background Studio Backdrop -->
  <rect width="320" height="380" fill="url(#pGrad)" rx="8"/>
  <rect x="8" y="8" width="304" height="364" fill="none" stroke="#C98A2C" stroke-width="2" rx="6"/>

  <!-- Academic Silhouette Graphic -->
  <g fill="#E2E8F0" opacity="0.95">
    <!-- Academic Robe / Suit Body -->
    <path d="M60 380 C60 280, 100 240, 160 240 C220 240, 260 280, 260 380 Z" fill="#06172A"/>
    <!-- Collar & Tie -->
    <polygon points="160,250 145,285 175,285" fill="#FFFFFF"/>
    <polygon points="156,285 164,285 167,360 153,360" fill="#991B1B"/>
    <!-- Suit Lapels -->
    <polygon points="120,270 145,285 130,360 110,360" fill="#1E293B"/>
    <polygon points="200,270 175,285 190,360 210,360" fill="#1E293B"/>
    <!-- Head / Face -->
    <ellipse cx="160" cy="180" rx="42" ry="52" fill="#D4A373"/>
    <!-- Hair -->
    <path d="M118 165 C118 125, 140 120, 160 120 C180 120, 202 125, 202 165 C190 150, 130 150, 118 165 Z" fill="#475569"/>
    <!-- Glasses -->
    <rect x="132" y="166" width="22" height="15" rx="3" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="166" y="166" width="22" height="15" rx="3" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="154" y1="172" x2="166" y2="172" stroke="#0F172A" stroke-width="2.5"/>
  </g>

  <!-- Formal Caption Banner at Bottom -->
  <rect x="16" y="315" width="288" height="50" rx="4" fill="#0A2540" opacity="0.92" stroke="#C98A2C" stroke-width="1"/>
  <text x="160" y="335" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Prof. (Dr.) Farooq Ahmad Mir</text>
  <text x="160" y="352" font-family="'Outfit', sans-serif" font-size="9.5" font-weight="600" fill="#FDE68A" text-anchor="middle">Ph.D. (IIT Delhi) • Principal, KCET</text>
</svg>

